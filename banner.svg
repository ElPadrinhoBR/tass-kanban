<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="150" y1="0" x2="150" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="450" y1="0" x2="450" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
    <line x1="1050" y1="0" x2="1050" y2="480" />
  </g>

  <!-- Glowing Radial Auras -->
  <circle cx="200" cy="120" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Top Pill / Badge -->
  <g transform="translate(425, 45)">
    <rect width="350" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <text x="175" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
      ⚡ AUTONOMOUS AGENTIC KANBAN SIMULATOR
    </text>
  </g>

  <!-- Main Logo & Title -->
  <g transform="translate(600, 150)">
    <text x="0" y="0" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" text-anchor="middle" letter-spacing="4">
      TASS KANBAN
    </text>
    <text x="0" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" text-anchor="middle" letter-spacing="1">
      The Flight Simulator for Agile Teams, Scrum Masters &amp; Tech Leaders
    </text>
  </g>

  <!-- 4 Autonomous Agent Profile Cards -->
  <g transform="translate(100, 245)">
    <!-- Agent 1: Ana (PO) -->
    <g transform="translate(0, 0)">
      <rect width="220" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="38" cy="38" r="20" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
      <text x="38" y="45" font-size="20" text-anchor="middle">👩‍💼</text>
      <text x="70" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Ana Oliveira</text>
      <text x="70" y="52" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Product Owner</text>
      <text x="20" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Priorização de Backlog, ROI &amp; Negociação</text>
    </g>

    <!-- Agent 2: Carlos (Dev) -->
    <g transform="translate(260, 0)">
      <rect width="220" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="38" cy="38" r="20" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" />
      <text x="38" y="45" font-size="20" text-anchor="middle">👨‍💻</text>
      <text x="70" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Carlos Silva</text>
      <text x="70" y="52" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Full-Stack Dev</text>
      <text x="20" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Pull Requests, Débito Técnico &amp; Velocity</text>
    </g>

    <!-- Agent 3: Marcos (Tech Lead) -->
    <g transform="translate(520, 0)">
      <rect width="220" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="38" cy="38" r="20" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
      <text x="38" y="45" font-size="20" text-anchor="middle">👨‍🏫</text>
      <text x="70" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Marcos Souza</text>
      <text x="70" y="52" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tech Lead</text>
      <text x="20" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Arquitetura, Code Review &amp; Qualidade</text>
    </g>

    <!-- Agent 4: Julia (QA) -->
    <g transform="translate(780, 0)">
      <rect width="220" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="38" cy="38" r="20" fill="#ec4899" fill-opacity="0.2" stroke="#f472b6" stroke-width="1" />
      <text x="38" y="45" font-size="20" text-anchor="middle">🧪</text>
      <text x="70" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Júlia Lima</text>
      <text x="70" y="52" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">QA Engineer</text>
      <text x="20" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Bugs Críticos, Critérios de Aceite &amp; Testes</text>
    </g>
  </g>

  <!-- Bottom Feature Badges & Language Tags -->
  <g transform="translate(600, 420)">
    <rect x="-420" y="-22" width="840" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="2" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      🎮 Interactive Live Sandbox &nbsp;•&nbsp; 💬 Slack / Teams Simulator &nbsp;•&nbsp; 🏆 Gamified Career Tree &nbsp;•&nbsp; 🌐 🇧🇷 PT &nbsp;|&nbsp; 🇺🇸 EN &nbsp;|&nbsp; 🇪🇸 ES
    </text>
  </g>
</svg>
