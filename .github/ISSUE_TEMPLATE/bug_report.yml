name: Bug Report
description: Report a reproducible bug in TASS Kanban
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of the bug.
      placeholder: "e.g. WIP limit badge disappears after theme change"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Tell us exactly how to reproduce the problem.
      placeholder: |
        1. Open the app and start a simulation
        2. Switch theme from Midnight Pro to Trello Blue
        3. Notice that WIP badge count is gone
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: "WIP limit badge should still show the correct count after theme change."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, macOS Sequoia, Ubuntu 24.04"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: Paste any screenshots or screen recording links here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might help us debug the issue.
